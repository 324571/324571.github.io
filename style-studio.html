<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionLab</title>
<p id="status" role="status">VisionLab wird entpackt …</p>
<script>window.visionLabParts = [];</script>
<script src="assets/part-01.js"></script>
<script src="assets/part-02.js"></script>
<script src="assets/part-03.js"></script>
<script src="assets/part-04.js"></script>
<script>
(async () => {
  const status = document.getElementById('status');
  try {
    const parts = window.visionLabParts;
    if (parts.length !== 4) throw new Error('An asset file is missing.');
    const bytes = parts.map(part => {
      if (Uint8Array.fromBase64) return Uint8Array.fromBase64(part);
      const decoded = atob(part);
      return Uint8Array.from(decoded, char => char.charCodeAt(0));
    });
    delete window.visionLabParts;
    const stream = new Blob(bytes).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    status.textContent = 'Die Datei konnte nicht geöffnet werden. Öffne index.html in Chrome und prüfe, ob der assets-Ordner direkt daneben liegt.';
    console.error(error);
  }
})();
</script>
