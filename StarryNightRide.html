<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StarryNightRide</title>
<style>
/* VOICE: a night ride inside a painting, hushed and warm
   IDEA: the canvas itself is the game; UI is small gilt labels on the frame
   PICTURE: full-bleed brush-stroke world
   COLOUR and TYPE: ultramarine night, lamplight gold; Georgia serif
   LAYOUT: canvas fills the screen, small HUD top-left, touch controls in corners */
html,body{margin:0;height:100%;background:#0a1440;overflow:hidden;touch-action:none;font-family:Georgia,'Palatino Linotype',serif;color:#f4e3a3;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100vw - 24px)}
#hud h1{margin:0;font-size:22px;font-weight:normal;letter-spacing:.02em;text-shadow:0 1px 3px #000a}
#row{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
button{font:15px Georgia,serif;color:#f4e3a3;background:#0c1a52cc;border:1px solid #d9b65a88;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
button[aria-pressed=true]{background:#d9b65a;color:#0c1a52}
button:focus-visible{outline:2px solid #fff3b0;outline-offset:2px}
#stats,#help{font-size:13px;opacity:.85;text-shadow:0 1px 2px #000}
#load{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 60% 35%,#1f3f9a,#08113a 70%);z-index:5;transition:opacity .8s}
#load div{text-align:center}
#load h2{font-weight:normal;font-size:34px;margin:0 0 10px}
#bar{width:min(320px,70vw);height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;margin:auto}
#bar i{display:block;height:100%;width:0;background:#e9c25a}
#msg{font-size:14px;margin-top:10px;opacity:.8}
#joy{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#0c1a5255;border:2px solid #d9b65a77;display:none;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#e9c25acc}
#jump{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;display:none;font-size:17px;touch-action:none}
.touch #joy,.touch #jump{display:block}
.touch #help{display:none}
#err{position:fixed;inset:auto 10px 10px 10px;color:#ffb0a0;font:13px monospace;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>StarryNightRide</h1>
  <div id="row">
    <button id="bFollow" aria-pressed="true">Follow path</button>
    <button id="bTour" aria-pressed="false">Camera tour</button>
  </div>
  <div id="stats"></div>
  <div id="help">WASD ride · Shift gallop · Space jump · drag to look · wheel to zoom · F follow path · T tour</div>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">Jump</button>
<div id="load"><div><h2>StarryNightRide</h2><div id="bar"><i></i></div><div id="msg">Mixing paints…</div></div></div>
<div id="err"></div>
<script type="module">
{
const $=id=>document.getElementById(id);
const showErr=e=>{$('err').textContent+=String(e&&e.stack||e)+'\n';console.error(e)};
window.addEventListener('error',e=>showErr(e.error||e.message));
const params=new URLSearchParams(location.search);
const TEST=params.has('test');
const TOUCH=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0);
if(TOUCH)document.body.classList.add('touch');
const Q=params.has('q')?+params.get('q'):(TOUCH?0.4:1);
const QS=Q<1?1/Math.sqrt(Q):1;

// ---------------- math & noise ----------------
const TAU=Math.PI*2;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261123);const RR=(a,b)=>a+(b-a)*R();
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const mix=(a,b,t)=>a+(b-a)*t;
function hash2(i,j){let h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*17.3,y*f-i*9.1);n+=a;f*=2.03;a*=.5}return s/n}
const v3={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
 cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len:a=>Math.hypot(a[0],a[1],a[2]),norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]}};
function M4(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m}
function mmul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o}
function Tm(x,y,z){const m=M4();m[12]=x;m[13]=y;m[14]=z;return m}
function Rx(a){const m=M4(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m}
function Ry(a){const m=M4(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m}
function Rz(a){const m=M4(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m}
const chain=(...ms)=>ms.reduce((a,b)=>mmul(a,b));
const xf=(m,p)=>[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];
function perspective(fy,as,n,f){const t=1/Math.tan(fy/2),nf=1/(n-f),m=new Float32Array(16);m[0]=t/as;m[5]=t;m[10]=(f+n)*nf;m[11]=-1;m[14]=2*f*n*nf;return m}
function lookAt(e,c){const z=v3.norm(v3.sub(e,c)),x=v3.norm(v3.cross([0,1,0],z)),y=v3.cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-v3.dot(x,e),-v3.dot(y,e),-v3.dot(z,e),1])}

// ---------------- palette (highlight, shadow, lamp-warm) ----------------
const PAL=[
['GROUND','#7391a8','#1a2a5c','#c99a4a'],['GRASS','#7fa7a2','#1b3858','#b9b54a'],['ROAD','#8e9cb6','#2c3a6a','#e3bb72'],
['PETAL','#e2c45e','#5e5a4c','#ffc41c'],['DISC','#6a5636','#221c26','#7a3f12'],['STEM','#5f8676','#182e46','#72a02c'],
['WHEAT','#bdbb90','#3f4f7c','#f2c452'],['CYP','#2d5b5e','#0a1530','#3d5c1e'],['WALL','#bccbdc','#3a4c80','#f4d99c'],
['ROOF','#5a6e9e','#1a2352','#b9572c'],['STONE','#8e9bb6','#283364','#caa272'],['WOOD','#6f6a7c','#1e1f3a','#8c5627'],
['WIN','#fff0a0','#f09418','#ffd060'],['WATER','#4d7cb4','#0c1c4e','#e0a040'],['MT1','#3b5d86','#101e48','#5a6a50'],
['MT2','#4f6f9c','#18285c','#6a7a70'],['MT3','#6c88b2','#22346a','#8090a0'],['SNOW','#dce7f4','#6c82b6','#f0e8d0'],
['SKY','#3466c6','#0d1d6a','#3466c6'],['SKYT','#58aab0','#1b4c7c','#58aab0'],['SKYS','#f2f2c8','#86b8de','#f2f2c8'],
['MOON','#ffe680','#ee9a1a','#ffe680'],['HALO','#f8f0aa','#9ccac8','#f8f0aa'],['STAR','#fff8bc','#f3be30','#fff8bc'],
['HORSE','#8c6c5c','#281a2a','#9c5a2a'],['HDARK','#3c2e38','#0f0b18','#3c2212'],['CLOAK','#5480d6','#13286e','#4474d8'],
['HAT','#46425c','#110f22','#4c3218'],['SKIN','#c6b2aa','#48384a','#f2c292'],['LEATH','#6c4e46','#1e1420','#7c3c1a'],
['LANT','#fff4a8','#ff9a1e','#fff4a8'],['OUTL','#1c2c6c','#091034','#2c1c3c'],['BLANK','#8c5c6c','#281430','#c4322a'],
['FOAM','#e8f2ff','#6a8ec8','#f2e8d0'],['ROCK','#7c88a2','#21284e','#a27c5a'],['SAIL','#d6ceb4','#4a5478','#eadab2'],
['SOIL','#5e6c8a','#191f44','#8a5a32'],['FOL','#3e6a6a','#0e2038','#5a7a2a']];
const M={};PAL.forEach((p,i)=>M[p[0]]=i);
const F={SKY:1,FLOW:2,WATER:4,EMIS:8,NOLOD:16,FALL:32,VEG:64};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);

// ---------------- stroke buffers ----------------
class SB{constructor(c){this.n=0;this.cap=0;this.grow(c)}
 grow(c){const old=this.u32;this.ab=new ArrayBuffer(c*32);this.f=new Float32Array(this.ab);this.i8=new Int8Array(this.ab);this.u8=new Uint8Array(this.ab);this.u16=new Uint16Array(this.ab);this.u32=new Uint32Array(this.ab);if(old)this.u32.set(old.subarray(0,this.n*8));this.cap=c}}
let cur=null;
function S(p,n,t,len,wid,mat,bone=0,fl=0,w=0,ao=1){
 const B=cur;if(B.n>=B.cap)B.grow(B.cap*2);
 let nx=n[0],ny=n[1],nz=n[2],l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
 let tx=t[0],ty=t[1],tz=t[2];const d=tx*nx+ty*ny+tz*nz;tx-=nx*d;ty-=ny*d;tz-=nz*d;l=Math.hypot(tx,ty,tz);
 if(l<1e-5){if(Math.abs(nx)<.9){tx=0;ty=-nz;tz=ny}else{tx=nz;ty=0;tz=-nx}l=Math.hypot(tx,ty,tz)}
 tx/=l;ty/=l;tz/=l;
 const i=B.n++,o=i*8,b=i*32,s=i*16;
 B.f[o]=p[0];B.f[o+1]=p[1];B.f[o+2]=p[2];
 B.i8[b+12]=Math.round(nx*127);B.i8[b+13]=Math.round(ny*127);B.i8[b+14]=Math.round(nz*127);B.i8[b+15]=Math.round(clamp(ao,0,1)*127);
 B.i8[b+16]=Math.round(tx*127);B.i8[b+17]=Math.round(ty*127);B.i8[b+18]=Math.round(tz*127);B.i8[b+19]=0;
 B.u8[b+20]=mat;B.u8[b+21]=bone;B.u8[b+22]=fl;B.u8[b+23]=clamp(Math.round(w),0,255);
 const q=(fl&F.SKY)?1:QS;
 B.u16[s+12]=clamp(Math.round(len*q*100),1,65535);B.u16[s+13]=clamp(Math.round(wid*q*100),1,65535);
 B.u16[s+14]=Math.floor(R()*65535);B.u16[s+15]=Math.floor(R()*65535);
}
const jit=(v,a)=>v3.add(v,[RR(-a,a),RR(-a,a),RR(-a,a)]);
// parametric surface sampler: strokes proportional to area
function surf(f,dens,o){
 const e=1e-3,G=10;
 const J=(u,v)=>{const a=f(u+e,v),b=f(u-e,v),c=f(u,v+e),d=f(u,v-e);const du=v3.mul(v3.sub(a,b),1/(2*e)),dv=v3.mul(v3.sub(c,d),1/(2*e));const n=v3.cross(du,dv);return{du,dv,n,j:v3.len(n)}};
 let A=0,Jm=1e-9;for(let i=0;i<G;i++)for(let j=0;j<G;j++){const q=J((i+.5)/G,(j+.5)/G).j;A+=q/(G*G);Jm=Math.max(Jm,q)}
 const cnt=Math.max(o.min||1,Math.round(A*dens*Q));
 for(let k=0;k<cnt;k++){let u,v,q,tr=0;do{u=R();v=R();q=J(u,v)}while(R()*Jm*1.05>q.j&&++tr<12);
  const p=f(u,v);if(o.skip&&o.skip(u,v,p))continue;
  let n=o.flip?v3.mul(q.n,-1):q.n;
  const t=o.tan?o.tan(u,v,p,q.du,q.dv,n):jit(v3.norm(q.du),.25);
  const mat=o.matf?o.matf(u,v,p):o.mat;
  S(p,n,t,RR(o.len[0],o.len[1]),RR(o.wid[0],o.wid[1]),mat,o.bone||0,o.fl||0,o.w||0,o.aof?o.aof(u,v,p):(o.ao??1));
 }}

// ---------------- world layout ----------------
const routeR=th=>140+16*Math.sin(3*th+.5);
const routeP=th=>{const r=routeR(th);return[r*Math.cos(th),r*Math.sin(th)]};
const routeT=th=>{const a=routeP(th-.001),b=routeP(th+.001),l=Math.hypot(b[0]-a[0],b[1]-a[1]);return[(b[0]-a[0])/l,(b[1]-a[1])/l]};
const LK={x:-35,z:5,rx:42,rz:30};
const riverX=z=>-40-.13*(z-20)+10*Math.sin(z/45);
const cliffZ=x=>300+15*Math.sin(x/40);
const plateau=(x,z)=>26*smooth(-4,4,z-cliffZ(x))*smooth(-300,-240,x)*(1-smooth(40,110,x));
const waterLevel=z=>-.6+plateau(riverX(z),z);
function waterDist(x,z){let d=1e9;if(z>LK.z&&z<500){d=Math.abs(x-riverX(z))-7*(1-smooth(440,500,z))}
 const q=Math.hypot((x-LK.x)/LK.rx,(z-LK.z)/LK.rz);return Math.min(d,(q-1)*LK.rz)}
const WM={x:195*Math.cos(-1.2),z:195*Math.sin(-1.2)};
const COT={x:178*Math.cos(-1.36),z:178*Math.sin(-1.36)};
const VIL={x:-172,z:178,h:null};
function h0(x,z){const r=Math.hypot(x,z);
 let h=((fbm(x*.0045+3.1,z*.0045+1.7,4)-.5)*30+(fbm(x*.02+9,z*.02,2)-.5)*3)*mix(.3,1,smooth(170,420,r));
 h+=plateau(x,z)+5*Math.exp(-((x-WM.x)**2+(z-WM.z)**2)/800);
 if(VIL.h!==null){const vm=smooth(85,50,Math.hypot(x-VIL.x,z-VIL.z));if(vm>0)h=mix(h,VIL.h,vm)}
 return h}
VIL.h=h0(VIL.x,VIL.z);
// bridge where route crosses river
const BR=(()=>{let best=1e9,bt=0;for(let t=1.3;t<2.6;t+=.0005){const p=routeP(t),d=Math.abs(p[0]-riverX(p[1]));if(d<best){best=d;bt=t}}
 const p=routeP(bt),u=routeT(bt);return{th:bt,x:p[0],z:p[1],ux:u[0],uz:u[1],vx:-u[1],vz:u[0],deck:waterLevel(p[1])+3.8,hl:17}})();
const brLocal=(x,z)=>[(x-BR.x)*BR.ux+(z-BR.z)*BR.uz,(x-BR.x)*BR.vx+(z-BR.z)*BR.vz];
function terrainH(x,z){let h=h0(x,z);
 const r=Math.hypot(x,z),th=Math.atan2(z,x),dr=Math.abs(r-routeR(th));
 if(dr<12){const p=routeP(th);h=mix(h,h0(p[0],p[1]),smooth(12,4.5,dr))}
 const wd=waterDist(x,z);
 if(wd<40){const wl=waterLevel(Math.max(z,LK.z));h=Math.max(h,mix(wl+1.4,h,smooth(3,35,wd)));h=mix(wl-2.2,h,smooth(-1.5,2.5,wd))}
 const [a,b]=brLocal(x,z);
 if(Math.abs(a)<34&&Math.abs(b)<9&&wd>1.5){const tg=BR.deck-Math.max(0,Math.abs(a)-15)*.22;h=Math.max(h,mix(h,tg,smooth(9,4,Math.abs(b))))}
 return h}
// heightmap (2 m grid over [-512,512])
const HN=513,HM=new Float32Array(HN*HN);
function hmAt(x,z){if(Math.abs(x)>511||Math.abs(z)>511)return terrainH(x,z);
 const gx=(x+512)/2,gz=(z+512)/2,i=Math.floor(gx),j=Math.floor(gz),fx=gx-i,fz=gz-j,k=j*HN+i;
 return mix(mix(HM[k],HM[k+1],fx),mix(HM[k+HN],HM[k+HN+1],fx),fz)}
const tNorm=(x,z,e=1.5)=>v3.norm([hmAt(x-e,z)-hmAt(x+e,z),2*e,hmAt(x,z-e)-hmAt(x,z+e)]);
function onDeck(x,z){const[a,b]=brLocal(x,z);return Math.abs(a)<BR.hl&&Math.abs(b)<3.3}
const physH=(x,z)=>onDeck(x,z)?Math.max(hmAt(x,z),BR.deck):hmAt(x,z);
// roads: route ring, spur to village, village streets
const SEG=[];
function segDist(x,z,s){const dx=s[2]-s[0],dz=s[3]-s[1],t=clamp(((x-s[0])*dx+(z-s[1])*dz)/(dx*dx+dz*dz),0,1);return Math.hypot(x-s[0]-dx*t,z-s[1]-dz*t)}
function roadDist(x,z){const r=Math.hypot(x,z);let d=Math.abs(r-routeR(Math.atan2(z,x)));for(const s of SEG)d=Math.min(d,segDist(x,z,s)-1.2);return d}
const spurP=routeP(2.32);SEG.push([spurP[0],spurP[1],VIL.x+8,VIL.z-6]);
for(const a of[.4,2.1,3.6,5.1])SEG.push([VIL.x,VIL.z,VIL.x+Math.cos(a)*62,VIL.z+Math.sin(a)*62]);
const inSun=(x,z)=>{const th=Math.atan2(z,x),dr=Math.hypot(x,z)-routeR(th);return th>-.85&&th<.85&&dr>-65&&dr<60&&Math.abs(dr)>5.5};
const inWheat=(x,z)=>{const th=Math.atan2(z,x),thp=th<0?th+TAU:th,dr=Math.hypot(x,z)-routeR(th);
 if(Math.hypot(x-VIL.x,z-VIL.z)<80||Math.hypot(x-WM.x,z-WM.z)<26||Math.hypot(x-COT.x,z-COT.z)<20||roadDist(x,z)<5||waterDist(x,z)<6)return false;
 return(thp>2.4&&thp<3.6&&dr>-55&&dr<85)||(th>-2.45&&th<-1.75&&dr>8&&dr<70)||(th>-1.32&&th<-.98&&dr>-50&&dr<-8)};

// houses, lights, trees, obstacles
const HOUSES=[],LIGHTS=[],CYP=[],OBS=[];
{let tries=0;while(HOUSES.length<15&&tries++<600){const a=R()*TAU,r=RR(20,60),x=VIL.x+Math.cos(a)*r,z=VIL.z+Math.sin(a)*r;
 if(HOUSES.some(h=>Math.hypot(h.x-x,h.z-z)<15)||roadDist(x,z)<7||waterDist(x,z)<12)continue;
 const near=SEG.slice(1).reduce((b,s)=>{const d=segDist(x,z,s);return d<b.d?{d,s}:b},{d:1e9}).s;
 const yaw=Math.atan2(near[2]-near[0],near[3]-near[1])+(R()<.5?0:Math.PI/2);
 HOUSES.push({x,z,yaw,w:RR(7,10),d:RR(5.5,7.5),h:RR(4.5,6.5),rh:RR(2.8,4)})}}
const CH={x:VIL.x-6,z:VIL.z+28};
for(const[t,dr,hh]of[[2.75,16,27],[2.9,-14,17],[1.45,13,15],[1.2,-15,19],[.95,-80,16],[-.5,-14,14],[-1.7,14,20],[-2.2,-12,15],[3.3,22,18],[-2.9,15,16],[.3,70,18]]){const p=routeP(t),r=Math.hypot(p[0],p[1]);CYP.push({x:p[0]*(r+dr)/r,z:p[1]*(r+dr)/r,h:hh})}
for(const[x,z,h]of[[VIL.x+40,VIL.z+40,19],[VIL.x-45,VIL.z+10,16],[VIL.x+15,VIL.z-48,14],[CH.x+14,CH.z+8,18],[COT.x-12,COT.z-8,13],[WM.x+16,WM.z-10,12],[LK.x-46,LK.z-12,15],[LK.x+40,LK.z+26,13]])CYP.push({x,z,h});

 if(ptrs.size===1){G.camYaw-=(e.clientX-p[0])*.006;G.camPitch=clamp(G.camPitch+(e.clientY-p[1])*.004,-.15,1.3);G.lastDrag=G.time}
 ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch0>0)G.camDist=clamp(dist0*pinch0/d,4,45)}});
const pend=e=>{ptrs.delete(e.pointerId);pinch0=0};cv.addEventListener('pointerup',pend);cv.addEventListener('pointercancel',pend);
cv.addEventListener('wheel',e=>{e.preventDefault();G.camDist=clamp(G.camDist*Math.exp(e.deltaY*.001),4,45)},{passive:false});
{const jb=$('joy'),kn=$('knob');let jid=null;const upd=e=>{const r=jb.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}G.joy=[x,y];kn.style.transform=`translate(${x*40}px,${y*40}px)`};
 jb.addEventListener('pointerdown',e=>{jid=e.pointerId;jb.setPointerCapture(jid);upd(e);if(G.follow)setFollow(false)});jb.addEventListener('pointermove',e=>{if(e.pointerId===jid)upd(e)});
 const je=e=>{if(e.pointerId!==jid)return;jid=null;G.joy=[0,0];kn.style.transform=''};jb.addEventListener('pointerup',je);jb.addEventListener('pointercancel',je);
 $('jump').addEventListener('pointerdown',e=>{e.preventDefault();G.jumpReq=true})}
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};

function update(dt){G.time+=dt;
 let tSpeed=0,steer=0,jump=G.jumpReq;G.jumpReq=false;
 const fwd=[Math.sin(G.yaw),0,Math.cos(G.yaw)];const p=PH.pos;
 const jl=Math.hypot(G.joy[0],G.joy[1]);
 if(G.follow){const th=Math.atan2(p[2],p[0]),tp=routeP(th+.15),want=Math.atan2(tp[0]-p[0],tp[1]-p[2]);steer=clamp(angDiff(G.yaw,want)*2.5,-1.6,1.6);tSpeed=keys.shift?15:9.5;
  for(const o of OBS){const dx=o.x-p[0],dz=o.z-p[2],a=dx*fwd[0]+dz*fwd[2],b=Math.abs(-dx*fwd[2]+dz*fwd[0]);if(b<4&&a>0&&a<G.speed*.34+2.4&&PH.grounded)jump=true}}
 else if(jl>.12){const cf=[Math.sin(G.camYaw),Math.cos(G.camYaw)],cr=[-Math.cos(G.camYaw),Math.sin(G.camYaw)];const dx=cf[0]*-G.joy[1]+cr[0]*G.joy[0],dz=cf[1]*-G.joy[1]+cr[1]*G.joy[0];
  steer=clamp(angDiff(G.yaw,Math.atan2(dx,dz))*3,-2,2);tSpeed=jl>.88?15:8*jl}
 else{if(keys.w||keys.arrowup)tSpeed=keys.shift?15:7;if(keys.s||keys.arrowdown)tSpeed=-2;if(keys.a||keys.arrowleft)steer=1.7;if(keys.d||keys.arrowright)steer=-1.7}
 const acc=tSpeed>G.speed?6:10;G.speed+=clamp(tSpeed-G.speed,-acc*dt,acc*dt);
 G.yaw+=steer*dt*(PH.grounded?1:.3);
 const sp=PH.grounded?G.speed:G.speed;const vx=Math.sin(G.yaw)*sp,vz=Math.cos(G.yaw)*sp;
 let rad=Math.hypot(p[0],p[2]);let cx=vx,cz=vz;if(rad>320){cx-=p[0]/rad*(rad-320)*2;cz-=p[2]/rad*(rad-320)*2}
 physStep(dt,cx,cz,jump);
 G.air=PH.grounded?Math.max(0,G.air-dt*4):Math.min(1,G.air+dt*5);
 G.phase+=dt*(Math.abs(G.speed)*.42+(Math.abs(G.speed)>.3?.25:0));
 const q=PH.pos,ga=physH(q[0]+fwd[0]*1.2,q[2]+fwd[2]*1.2),gb=physH(q[0]-fwd[0]*1.2,q[2]-fwd[2]*1.2);G.pitch=mix(G.pitch,PH.grounded?Math.atan2(ga-gb,2.4):clamp(PH.vel[1]*.05,-.3,.3),.15);
 G.lean=mix(G.lean,-steer*G.speed*.012,.1);
 if(G.time-G.lastDrag>2.5&&Math.abs(G.speed)>1&&!G.tour)G.camYaw+=angDiff(G.camYaw,G.yaw)*Math.min(1,dt*1.2);
 G.wind=.7+.3*Math.sin(G.time*.3);
 if(G.tour)G.tourT+=dt}

// ---------------- animation: bones ----------------
const BONES=new Float32Array(32*16);let LANTP=[0,0,0];
function setBone(i,m){BONES.set(m,i*16)}
function animate(){const t=G.time,sp=Math.abs(G.speed),p=PH.pos,ph=G.phase*TAU;
 setBone(B.WIND,chain(Tm(WM.x+Math.sin(WM.yaw)*3.3,WM.g+WM.TH-.6,WM.z+Math.cos(WM.yaw)*3.3),Ry(WM.yaw),Rz(t*.55)));
 const gal=smooth(9,14,sp),trot=smooth(1,5,sp)*(1-gal);
 const bob=(trot*.07+gal*.12)*Math.abs(Math.sin(ph))+sp*.003;
 const root=chain(Tm(p[0],p[1]-.8,p[2]),Ry(G.yaw),Rz(G.lean),Rx(-G.pitch-gal*.05*Math.sin(ph)));
 const body=mmul(root,Tm(0,1.35+bob,0));setBone(B.BODY,body);
 const neck=chain(body,Tm(0,.35,.95),Rx(.55+gal*.25*Math.sin(ph+1)+trot*.06*Math.sin(ph*2)-G.air*.25));setBone(B.NECK,neck);
 setBone(B.HEAD,chain(neck,Tm(0,1.05,0),Rx(1.6+.08*Math.sin(t*1.3)+G.air*.2)));
 setBone(B.TAIL,chain(body,Tm(0,.3,-1.02),Rx(-.35-sp*.04-G.air*.4),Rz(.15*Math.sin(t*2.1))));
 const offs=[[0,.5,.5,0],[0,.12,.55,.67]],hips=[[.24,-.2,.75],[-.24,-.2,.75],[.24,-.2,-.75],[-.24,-.2,-.75]];
 for(let l=0;l<4;l++){const o=mix(offs[0][l],offs[1][l],gal),amp=.15*smooth(.2,2,sp)+.25*trot+.42*gal;const s=Math.sin(ph+o*TAU);let a=amp*s,kb=Math.max(0,Math.cos(ph+o*TAU))*(.3+.7*(trot+gal))*smooth(.2,2,sp);
  const back=l>=2;if(G.air>0){a=mix(a,back?-.55:.7,G.air);kb=mix(kb,back?.2:1.5,G.air)}
  const ul=chain(body,Tm(...hips[l]),Rx(-a));setBone(B.UL+l,ul);setBone(B.LL+l,chain(ul,Tm(0,-.58,0),Rx(back?-kb*.8:kb*1.2)))}
 const torso=chain(body,Tm(0,.52+bob*.3,0),Rx(.06+gal*.25+G.air*.15));setBone(B.TORSO,torso);
 setBone(B.RHEAD,chain(torso,Tm(0,.82,0),Rx(-.1-gal*.15)));
 setBone(B.CLOAK,chain(torso,Tm(0,.72,-.04),Rx(-.08-sp*.025-G.air*.2+.05*Math.sin(t*3+ph))));
 setBone(B.LARM,chain(torso,Tm(.22,.66,0),Rx(-.9),Rz(.12)));
 const ra=chain(torso,Tm(-.24,.66,0),Rz(-.55),Rx(-.55));setBone(B.RARM,ra);
 const lant=chain(ra,Tm(0,-.58,0),Rx(.55+.12*Math.sin(ph)),Rz(.55));setBone(B.LANT,lant);LANTP=xf(lant,[0,-.35,0])}

// ---------------- camera & tour ----------------
const TOUR=[[[230,45,-50],[60,10,-170]],[[110,22,-250],[WM.x,10,WM.z]],[[-60,55,-190],[LK.x,0,LK.z]],[[-120,28,40],[BR.x,4,BR.z]],[[-110,42,190],[riverX(300),20,305]],[[-250,75,110],[VIL.x,10,VIL.z]],[[-330,150,-40],[0,120,700]],[[0,230,-330],[0,0,40]],[[210,14,70],[140,2,0]]];
const cr=(a,b,c,d,t)=>a.map((_,i)=>.5*(2*b[i]+(-a[i]+c[i])*t+(2*a[i]-5*b[i]+4*c[i]-d[i])*t*t+(-a[i]+3*b[i]-3*c[i]+d[i])*t*t*t));
function camera(){if(G.dbgCam)return G.dbgCam;if(G.tour){const s=G.tourT/8,i=Math.floor(s),f=s-i,n=TOUR.length,k=j=>TOUR[((j%n)+n)%n];
  const e=cr(k(i-1)[0],k(i)[0],k(i+1)[0],k(i+2)[0],f),c=cr(k(i-1)[1],k(i)[1],k(i+1)[1],k(i+2)[1],f);e[1]=Math.max(e[1],hmAt(e[0],e[2])+3);return{e,c}}
 const p=PH.pos,tg=[p[0],p[1]+2.6,p[2]],cp=Math.cos(G.camPitch);
 const e=[tg[0]-Math.sin(G.camYaw)*cp*G.camDist,tg[1]+Math.sin(G.camPitch)*G.camDist,tg[2]-Math.cos(G.camYaw)*cp*G.camDist];e[1]=Math.max(e[1],hmAt(e[0],e[2])+.8);return{e,c:tg}}

// ---------------- render ----------------
let scale=1,frames=0,fpsT=0,fps=60,drawn=0,lowT=0,highT=0;
const baseDpr=()=>TOUCH?(devicePixelRatio||1):Math.min(devicePixelRatio||1,2);
function resize(){const w=Math.max(1,Math.round(cv.clientWidth*baseDpr()*scale)),h=Math.max(1,Math.round(cv.clientHeight*baseDpr()*scale));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
const LP=new Float32Array(64),LC=new Float32Array(64);
function setCommon(P,view,proj,cam){const U=P.U;gl.useProgram(P.p);gl.uniformMatrix4fv(U.u_view,false,view);gl.uniformMatrix4fv(U.u_proj,false,proj);gl.uniform3fv(U.u_cam,cam);gl.uniform1f(U.u_time,G.time);
 gl.uniform3fv(U.u_moonDir,MOONDIR);gl.uniform1f(U.u_amb,.34);gl.uniform4fv(U.u_lp,LP);gl.uniform4fv(U.u_lc,LC);gl.uniform1i(U.u_nl,16);gl.uniform3fv(U.u_fog,[.09,.15,.36]);gl.uniform1f(U.u_fogD,1500);gl.uniform1i(U.u_data,0)}
function planes(m){const r=i=>[m[i],m[4+i],m[8+i],m[12+i]],r3=r(3),out=[];for(const i of[0,1,2])for(const s of[1,-1]){const a=r(i);out.push([r3[0]+s*a[0],r3[1]+s*a[1],r3[2]+s*a[2],r3[3]+s*a[3]])}return out}
function render(){const DBG=window.__dbg||{};resize();const W=cv.width,H=cv.height,fov=W<H?1.35:1.0;
 const {e,c}=camera();const view=lookAt(e,c),proj=perspective(fov,W/H,.5,6000),vp=mmul(proj,view);
 // lights: lantern + nearest static lamps, faded so nothing pops
 const fl=1+.12*Math.sin(G.time*13)+.08*Math.sin(G.time*7.3);
 const ls=LIGHTS.map(l=>({l,d:Math.hypot(l.p[0]-e[0],l.p[2]-e[2])})).sort((a,b)=>a.d-b.d);const dMax=ls[15]?ls[15].d:1e9;
 LP.set([LANTP[0],LANTP[1],LANTP[2],15],0);LC.set([1,.7,.32,1.25*fl],0);
 for(let i=1;i<16;i++){const s=ls[i-1];if(!s){LC[i*4+3]=0;continue}const k=clamp((dMax-s.d)/(dMax*.15+1),0,1);LP.set([...s.l.p,s.l.r],i*4);LC.set([...s.l.c,s.l.i*k],i*4)}
 gl.viewport(0,0,W,H);gl.clearColor(.07,.12,.33,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,dataTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,3,64,2,gl.RGBA,gl.FLOAT,BONES);
 // underlay
 setCommon(UP,view,proj,e);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(2,4);if(!DBG.ul)gl.bindVertexArray(UL_VAO),gl.drawElements(gl.TRIANGLES,UL_N,gl.UNSIGNED_INT,0);gl.disable(gl.POLYGON_OFFSET_FILL);
 // strokes
 setCommon(SP,view,proj,e);const U=SP.U,cssToPx=H/cv.clientHeight;
 gl.uniform1f(U.u_focal,H/(2*Math.tan(fov/2)));gl.uniform1f(U.u_minPx,3.4*cssToPx);gl.uniform1f(U.u_maxPx,120*cssToPx);gl.uniform1f(U.u_density,1);gl.uniform1f(U.u_layerK,.0025);gl.uniform1f(U.u_maxGrow,4);gl.uniform1f(U.u_wind,G.wind);
 gl.uniform1i(U.u_hm,1);gl.uniform1i(U.u_mask,2);gl.uniform1i(U.u_mode,0);gl.uniform1f(U.u_gR,40);
 gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);drawn=0;
 gl.bindVertexArray(VS_STAT.vao);gl.bindBuffer(gl.ARRAY_BUFFER,VS_STAT.b);const pl=planes(vp),bb=CELLS.bb,stt=CELLS.start;let runS=-1,runE=-1;
 const flush=()=>{if(runS>=0&&runE>runS){setInst(runS*32);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,runE-runS);drawn+=runE-runS}runS=-1};
 for(let ci=0;ci<CG*CG;ci++){const s0=stt[ci],s1=stt[ci+1];if(s1===s0)continue;const cx=ci%CG,cz=(ci/CG)|0,pad=bb[ci*6+5]*2+2;
  const mn=[-2600+cx*CS-pad,bb[ci*6+1]-pad,-2600+cz*CS-pad],mx=[-2600+(cx+1)*CS+pad,bb[ci*6+4]+pad,-2600+(cz+1)*CS+pad];let vis=true;
  for(const q of pl){if(q[0]*(q[0]>0?mx[0]:mn[0])+q[1]*(q[1]>0?mx[1]:mn[1])+q[2]*(q[2]>0?mx[2]:mn[2])+q[3]<0){vis=false;break}}
  if(vis&&!DBG.stat){if(runS<0)runS=s0;runE=s1}else flush()}
 flush();
 if(!DBG.dyn){gl.bindVertexArray(VS_DYN.vao);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,VS_DYN.n)}
 gl.uniform1i(U.u_mode,1);const gc=G.tour?e:PH.pos;gl.uniform3fv(U.u_gc,[gc[0],0,gc[2]]);if(!DBG.grass)gl.bindVertexArray(VS_GRASS.vao),gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,VS_GRASS.n);gl.uniform1i(U.u_mode,0);
 if(!DBG.sky)gl.bindVertexArray(VS_SKY.vao),gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,VS_SKY.n);
 drawn+=VS_DYN.n+VS_GRASS.n+VS_SKY.n;gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);gl.bindVertexArray(null)}
let last=0;
function loop(ts){const now=ts/1000,real=Math.max(.001,now-(last||now)),dt=Math.min(.05,real);last=now;
 try{let k=dt;while(k>1e-4){const s=Math.min(k,1/60);update(s);k-=s}animate();render()}catch(e){showErr(e);return}
 frames++;fpsT+=real;if(fpsT>=1){fps=frames/fpsT;frames=0;fpsT=0;
  if(!TEST){if(fps<40){lowT++;highT=0}else if(fps>57){highT++;lowT=0}else{lowT=highT=0}
   if(lowT>=2&&scale>.4){scale=Math.max(.4,scale*.85);lowT=0}if(highT>=4&&scale<1){scale=Math.min(1,scale*1.1);highT=0}}
  $('stats').textContent=`${fps.toFixed(0)} fps · ${(drawn/1e6).toFixed(2)}M strokes drawn of ${((VS_STAT.n+VS_DYN.n+VS_SKY.n+VS_GRASS.n)/1e6).toFixed(2)}M · ${Math.round(cv.width)}×${Math.round(cv.height)} (${Math.round(scale*100)}%) · physics: ${PH.mode}`}
 requestAnimationFrame(loop)}

// ---------------- boot ----------------
const step=(f,msg,pct)=>new Promise(r=>{$('msg').textContent=msg;$('bar').firstChild.style.width=pct+'%';setTimeout(()=>{f();r()},20)});
async function boot(){
 const phys=initPhysics();
 await step(()=>{for(let j=0;j<HN;j++)for(let i=0;i<HN;i++)HM[j*HN+i]=terrainH(-512+i*2,-512+j*2);for(const o of OBS)o.y=physH(o.x,o.z);PH.pos=[st0[0],physH(st0[0],st0[1])+.8,st0[1]]},'Priming the canvas…',8);
 await step(buildSky,'Swirling the sky…',20);
 await step(buildStatic,'Laying down a million brush strokes…',35);
 await step(buildDynamic,'Saddling the horse…',75);
 await step(uploadAll,'Varnishing…',88);
 $('msg').textContent='Loading physics…';await phys;
 if(PH.mode==='Rapier'){const p=PH.pos;body.setTranslation({x:p[0],y:p[1],z:p[2]},true)}
 $('load').style.opacity=0;setTimeout(()=>$('load').remove(),TEST?0:900);
 window.__SNR={statSB,M,G,PH,WM,COT,VIL,BR,CH,LK,hmAt,riverX,cliffZ,MOONDIR,render,animate,update,stats:()=>({stat:VS_STAT.n,dyn:VS_DYN.n,sky:VS_SKY.n,grass:VS_GRASS.n,drawn,phys:PH.mode,lights:LIGHTS.length,houses:HOUSES.length,obs:OBS.length})};
 if(TEST){window.__ready=true;return}
 requestAnimationFrame(loop)}
boot().catch(showErr);
}
